<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1280px;height:545px;overflow:hidden;background:#221418;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
    canvas{position:absolute;inset:0}
    .card{position:absolute;left:400px;top:0;width:480px;height:545px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 26px;color:#F3F0E8}
    .kick{font:15px Menlo,"PingFang SC",monospace;letter-spacing:.14em;color:#9AA7B5;display:flex;align-items:center;gap:10px;white-space:nowrap}
    .kick::before,.kick::after{content:"";width:28px;height:1px;background:#9AA7B5}
    .big{font-size:78px;font-weight:800;line-height:1.4;margin-top:22px;color:#E06C75;letter-spacing:-.02em}
    .title{font-size:34px;font-weight:800;line-height:1.3;margin-top:18px;white-space:nowrap}
    .sub{font-size:17px;color:#C9D3DD;margin-top:14px;line-height:1.5}
    svg{position:absolute;left:0;top:0}
    </style></head><body>
    <canvas id="c" width="2560" height="1090" style="width:1280px;height:545px"></canvas>
    <svg width="1280" height="545" viewBox="0 0 1280 545">
    <path d="M70 470 C160 470,180 470,255 470 S360 470,440 470 S545 470,625 470 S730 470,810 470 S915 470,995 470 S1100 470,1180 470" stroke="#3A4A5C" stroke-width="3" fill="none" stroke-dasharray="6 8"/>
    <g opacity="0.28">
        <circle cx="70" cy="470" r="9" fill="#9AA7B5" stroke="#221418" stroke-width="4"/>
        <text x="70" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#9AA7B5" font-family="Menlo,monospace">0</text>
        <text x="70" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">热身</text></g><g opacity="0.28">
        <circle cx="255" cy="470" r="9" fill="#5FA8D3" stroke="#221418" stroke-width="4"/>
        <text x="255" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#5FA8D3" font-family="Menlo,monospace">1</text>
        <text x="255" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">心智模型</text></g><g opacity="0.28">
        <circle cx="440" cy="470" r="9" fill="#E0A458" stroke="#221418" stroke-width="4"/>
        <text x="440" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#E0A458" font-family="Menlo,monospace">2</text>
        <text x="440" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">动手压测</text></g><g opacity="0.28">
        <circle cx="625" cy="470" r="9" fill="#7BC47F" stroke="#221418" stroke-width="4"/>
        <text x="625" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#7BC47F" font-family="Menlo,monospace">3</text>
        <text x="625" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">架构翻译</text></g><g opacity="0.28">
        <circle cx="810" cy="470" r="9" fill="#C98BDB" stroke="#221418" stroke-width="4"/>
        <text x="810" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#C98BDB" font-family="Menlo,monospace">3b</text>
        <text x="810" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">容量·缓存·合规</text></g><g opacity="1">
        <circle cx="995" cy="470" r="14" fill="#E06C75" stroke="#221418" stroke-width="4"/>
        <text x="995" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#E06C75" font-family="Menlo,monospace">4</text>
        <text x="995" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">实时多模态</text></g><g opacity="0.28">
        <circle cx="1180" cy="470" r="9" fill="#F2D479" stroke="#221418" stroke-width="4"/>

    <div class="card"><div class="kick">进化之路 · P4 · 1</div><div class="big">接力</div>

    <script>
    const c=document.getElementById('c'),g=c.getContext('2d');g.scale(2,2);
    g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1.2;
    for(const [cx,cy] of [[180,120],[1120,400],[640,560]]){
      for(let k=1;k<=14;k++){g.beginPath();
        for(let a=0;a<=Math.PI*2+.01;a+=.05){
          const r=k*34+Math.sin(a*3+k)*10+Math.cos(a*5-k*.7)*7;
          const x=cx+Math.cos(a)*r*1.4,y=cy+Math.sin(a)*r*.75;
          a===0?g.moveTo(x,y):g.lineTo(x,y);
        }g.stroke();
      }
    }
    g.fillStyle='rgba(255,255,255,0.05)';
    for(let x=0;x<1280;x+=40)for(let y=0;y<545;y+=40)g.fillRect(x,y,1,1);
    </script>
<script>
addEventListener('load', async () => {
  await document.fonts.ready;
  const W = 1280, H = 545, issues = [];
  for (const el of document.querySelectorAll('body, body *')) {
    if (!(el instanceof HTMLElement) || /^(SCRIPT|STYLE)$/.test(el.tagName)) continue;
    const cs = getComputedStyle(el), r = el.getBoundingClientRect();
    if (cs.display === 'none') continue;
    if (cs.display !== 'inline' && el.clientWidth && el.scrollWidth > el.clientWidth + 2)
      issues.push(`${el.tagName}.${el.className}: horizontal overflow`);
    if (cs.display !== 'inline' && el.clientHeight && el.scrollHeight > el.clientHeight + 2)
      issues.push(`${el.tagName}.${el.className}: vertical overflow ${el.scrollHeight}/${el.clientHeight}, line-height ${cs.lineHeight}`);
    if (r.left < -1 || r.top < -1 || r.right > W + 1 || r.bottom > H + 1)
      issues.push(`${el.tagName}.${el.className}: outside canvas`);
  }
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (!n.textContent.trim() || /^(SCRIPT|STYLE)$/.test(n.parentElement.tagName)) continue;
    const range = document.createRange(); range.selectNodeContents(n);
    for (const r of range.getClientRects()) {
      if (r.left < -1 || r.top < -1 || r.right > W + 1 || r.bottom > H + 1)
        issues.push(`text outside canvas: ${n.textContent.trim().slice(0, 32)}`);
    }
  }
  const report = document.createElement('script');
  report.id = 'layout-check'; report.type = 'application/json';
  report.textContent = JSON.stringify({width: W, height: H, dpr: devicePixelRatio, issues});
  document.body.append(report);
});
</script>
</body></html>
