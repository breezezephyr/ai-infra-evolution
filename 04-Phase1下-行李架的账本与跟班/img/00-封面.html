<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1280px;height:545px;overflow:hidden;background:#121C26;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
canvas{position:absolute;inset:0}
.card{position:absolute;left:400px;top:0;width:480px;height:545px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 26px;color:#F3F0E8}
.kick{font:15px Menlo,monospace;letter-spacing:.14em;color:#9AA7B5;display:flex;align-items:center;gap:10px}
.kick::before,.kick::after{content:"";width:28px;height:1px;background:#9AA7B5}
.big{font-size:78px;font-weight:800;line-height:1;margin-top:22px;color:#5FA8D3;letter-spacing:-.02em}
.title{font-size:34px;font-weight:800;line-height:1.3;margin-top:18px}
.sub{font-size:17px;color:#C9D3DD;margin-top:14px;line-height:1.5}
svg{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="c" width="2560" height="1090" style="width:1280px;height:545px"></canvas>
<svg width="1280" height="545" viewBox="0 0 1280 545">
<path d="M70 470 C 160 470, 180 470, 255 470 S 360 470, 440 470 S 545 470, 625 470 S 730 470, 810 470 S 915 470, 995 470 S 1100 470, 1180 470" stroke="#3A4A5C" stroke-width="3" fill="none" stroke-dasharray="6 8"/>
<g opacity="0.28"><circle cx="70" cy="470" r="9" fill="#9AA7B5" stroke="#121C26" stroke-width="4"/>
        <text x="70" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#9AA7B5" font-family="Menlo,monospace">0</text>
        <text x="70" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">热身</text></g><g opacity="1"><circle cx="255" cy="470" r="14" fill="#5FA8D3" stroke="#121C26" stroke-width="4"/>
        <text x="255" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#5FA8D3" font-family="Menlo,monospace">1</text>

        <text x="625" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">架构翻译</text></g><g opacity="0.28"><circle cx="810" cy="470" r="9" fill="#C98BDB" stroke="#121C26" stroke-width="4"/>
        <text x="810" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#C98BDB" font-family="Menlo,monospace">3b</text>
        <text x="810" y="534" text-anchor="middle" font-size="14" fill="#C9D3DD" font-family="PingFang SC">容量·缓存·合规</text></g><g opacity="0.28"><circle cx="995" cy="470" r="9" fill="#E06C75" stroke="#121C26" stroke-width="4"/>

<div class="card"><div class="kick">进化之路 · P1 · 下</div><div class="big">16 格</div><div class="title">行李架的账本<br>与跟班</div><div class="sub">格子 · 清单 · 共用 · 先猜再验 · 一张图</div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.scale(2,2);
// contour lines: layered noisy ellipses around two centers
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
const R=rnd(20260916);
g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1.2;
for(const [cx,cy] of [[180,120],[1120,400],[640,560]]){
  for(let k=1;k<=14;k++){g.beginPath();
    for(let a=0;a<=Math.PI*2+0.01;a+=0.05){const r=k*34+Math.sin(a*3+k)*10+Math.cos(a*5-k*.7)*7;
      const x=cx+Math.cos(a)*r*1.4,y=cy+Math.sin(a)*r*.75; a==0?g.moveTo(x,y):g.lineTo(x,y)}
    g.stroke()}}
// grid ticks
g.fillStyle='rgba(255,255,255,0.05)';for(let x=0;x<1280;x+=40)for(let y=0;y<545;y+=40)g.fillRect(x,y,1,1);
</script></body></html>
