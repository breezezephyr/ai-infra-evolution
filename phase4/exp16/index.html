<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>exp16 · 取消与播放 generation fence</title>
  <style>
    :root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#111827;color:#e5e7eb}
    body{max-width:1240px;margin:36px auto;padding:0 24px}h1{font-size:26px;margin-bottom:8px}
    .note{color:#aab8ce}label{display:inline-block;margin:12px 22px 12px 0}
    select,button{background:#23314a;color:#f3f4f6;border:1px solid #51647f;padding:8px 12px;border-radius:6px}
    button{cursor:pointer;background:#185b70}#status{padding:12px;background:#1c273b;border-radius:6px}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #344155}th{color:#9dd5e3;font-size:13px}
    pre{max-height:620px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1423;padding:16px}
    .table-scroll{overflow:auto}
  </style>
</head>
<body>
  <h1>exp16 · 取消、播放队列与 generation fence</h1>
  <p class="note">24 kHz PCM16LE → AudioWorklet。样本计数来自实际 render 消费；所有停止时延以同一 AudioContext 帧时钟计算。浏览器自动化不代表声学回环或听感评价。</p>
  <label>取消策略 <select id="policy"><option value="full">full · 服务端取消 + 播放 flush</option><option value="server_only">server_only · 旧队列自然播完</option></select></label>
  <label>触发样本 <select id="trigger"><option value="4800">4800 · 0.2 秒</option><option value="24000">24000 · 1 秒</option><option value="96000">96000 · 4 秒</option></select></label>
  <button id="run" type="button">运行一轮</button>
  <p id="status" role="status">就绪，等待启动。</p>
  <div class="table-scroll"><table>
    <thead><tr><th>策略</th><th>触发样本</th><th>结果</th><th>gen1 played</th><th>gen2 played</th><th>trigger→旧尾 ms<br>AudioContext 帧</th><th>trigger→flush ACK ms<br>主线程通知</th><th>stale 拒绝</th></tr></thead>
    <tbody id="results"></tbody>
  </table></div>
  <details open><summary>最近一轮完整记录</summary><pre id="record">{}</pre></details>
  <script src="client.js"></script>
</body>
</html>
